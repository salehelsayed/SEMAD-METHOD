      content: 3. Critical Thinking - Question assumptions and identify gaps, not just confirm what's present
      lineNumber: 36
    - type: special-note
      content: '[[LLM: Before evaluating this section, take a moment to fully understand the product''s purpose and goals from the PRD. What is the core problem being solved? Who are the users? What are the critical success factors? Keep these in mind as you validate alignment. For each item, don''t just check if it''s mentioned - verify that the architecture provides a concrete technical solution.]]'
      lineNumber: 47
    - type: special-note
      content: '[[LLM: Architecture clarity is crucial for successful implementation. As you review this section, visualize the system as if you were explaining it to a new developer. Are there any ambiguities that could lead to misinterpretation? Would an AI agent be able to implement this architecture without confusion? Look for specific diagrams, component definitions, and clear interaction patterns.]]'
      lineNumber: 75
    - type: special-note
      content: '[[LLM: Technology choices have long-term implications. For each technology decision, consider: Is this the simplest solution that could work? Are we over-engineering? Will this scale? What are the maintenance implications? Are there security vulnerabilities in the chosen versions? Verify that specific versions are defined, not ranges.]]'
      lineNumber: 111
    - type: special-note
      content: '[[LLM: Skip this entire section if this is a backend-only or service-only project. Only evaluate if the project includes a user interface.]]'
      lineNumber: 123
    - type: special-note
      content: '[[LLM: This entire section should be skipped for backend-only projects. Only evaluate if the project includes a user interface. When evaluating, ensure alignment between the main architecture document and the frontend-specific architecture document.]]'
      lineNumber: 149
    - type: special-note
      content: '[[LLM: Production systems fail in unexpected ways. As you review this section, think about Murphy''s Law - what could go wrong? Consider real-world scenarios: What happens during peak load? How does the system behave when a critical service is down? Can the operations team diagnose issues at 3 AM? Look for specific resilience patterns, not just mentions of "error handling".]]'
      lineNumber: 201
    - type: special-note
      content: '- [ ] Circuit breakers or fallbacks are specified for critical services'
      lineNumber: 207
    - type: special-note
      content: '[[LLM: Security is not optional. Review this section with a hacker''s mindset - how could someone exploit this system? Also consider compliance: Are there industry-specific regulations that apply? GDPR? HIPAA? PCI? Ensure the architecture addresses these proactively. Look for specific security controls, not just general statements.]]'
      lineNumber: 237
    - type: special-note
      content: '[[LLM: Clear implementation guidance prevents costly mistakes. As you review this section, imagine you''re a developer starting on day one. Do they have everything they need to be productive? Are coding standards clear enough to maintain consistency across the team? Look for specific examples and patterns.]]'
      lineNumber: 273
    - type: special-note
      content: '[[LLM: Skip this subsection for backend-only projects.]]'
      lineNumber: 293
    - type: special-note
      content: '[[LLM: Dependencies are often the source of production issues. For each dependency, consider: What happens if it''s unavailable? Is there a newer version with security patches? Are we locked into a vendor? What''s our contingency plan? Verify specific versions and fallback strategies.]]'
      lineNumber: 319
    - type: special-note
