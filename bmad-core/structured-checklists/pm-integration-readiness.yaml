id: pm-integration-readiness
name: PM Integration Readiness (Brownfield)
categories:
  - name: Integration Contracts
    items:
      - description: All integrationPoints (INT-*) enumerated with ownerTeam and contract links
        checked: false
      - description: Each INT has a SourceRef to current code (file#symbol, route, or module)
        checked: false
      - description: Delta classification per INT set (existing | extend | new)
        checked: false
      - description: SourceRef is present for every INT where delta ≠ new
        checked: false
      - description: Minimal contract snapshot per INT (request/response, errors, idempotency, version)
        checked: false
  - name: ECM Coverage
    items:
      - description: Epic Coverage Matrix (ECM) table present in the EpicContract
        checked: false
