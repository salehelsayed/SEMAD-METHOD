id: step1
name: Load Core Configuration and Check Workflow
description: ''
actions:
  - description: Load `.semad-core/core-config.yaml` from the project root (HIDDEN directory with dot prefix)
    elicit: false
    metadata:
      originalIndent: 0
  - description: 'If the file does not exist, HALT and inform the user: ".semad-core/core-config.yaml not found. This file is required for story creation. You can either: 1) Copy it from GITHUB .semad-core/core-config.yaml and configure it for your project OR 2) Run the BMad installer against your project to upgrade and add the file automatically. Please add and configure .semad-core/core-config.yaml before proceeding."'
    elicit: false
    metadata:
      originalIndent: 0
  - description: 'Extract key configurations: `devStoryLocation`, `prd.*`, `architecture.*`, `workflow.*`'
    elicit: false
    metadata:
      originalIndent: 0
  - description: 'CRITICAL VALIDATION: Verify that BOTH prdSharded AND architectureSharded are set to true'
    elicit: false
    metadata:
      originalIndent: 0
  - description: 'If prdSharded is false, HALT with error: "ERROR: PRD documents must be sharded before creating stories. Please run the shard-prd task to split your PRD into epic files in docs/prd/ directory. Story creation requires sharded documents for proper context management."'
    elicit: false
    metadata:
      originalIndent: 0
  - description: 'If architectureSharded is false, HALT with error: "ERROR: Architecture documents must be sharded before creating stories. Please run the shard-doc task on your architecture.md file to split it into component files in docs/architecture/ directory. Story creation requires sharded documents for proper technical context."'
    elicit: false
    metadata:
      originalIndent: 0
  - description: 'Verify sharded directories exist: Check that docs/prd/ and docs/architecture/ directories exist and contain files'
    elicit: false
    metadata:
      originalIndent: 0
  - description: 'If docs/prd/ is empty or missing, HALT with error: "ERROR: No sharded PRD files found in docs/prd/. Please ensure your PRD has been properly sharded into epic files."'
    elicit: false
    metadata:
      originalIndent: 0
  - description: 'If docs/architecture/ is empty or missing, HALT with error: "ERROR: No sharded architecture files found in docs/architecture/. Please ensure your architecture document has been properly sharded."'
    elicit: false
    metadata:
      originalIndent: 0
