id: create-next-story
name: Create Next Story Task
purpose: To identify the next logical story based on project progress and epic definitions, and then to prepare a comprehensive, self-contained, and actionable story file using the `Story Template`. This task ensures the story is enriched with all necessary technical context, requirements, and acceptance criteria, making it ready for efficient implementation by a Developer Agent with minimal need for additional research or finding its own context.
requirements:
  - SHARDED DOCUMENTS REQUIRED: This task requires both PRD and Architecture documents to be sharded
  - PRD must be split into epic files in docs/prd/ directory
  - Architecture must be split into component files in docs/architecture/ directory
  - Will not work with monolithic documents - sharding provides better context management
