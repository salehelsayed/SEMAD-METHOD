id: ingest-documentation
name: Ingest Documentation Locally
purpose: Fetch technical documentation from search results and persist curated summaries for offline agent access
inputs:
  searchToolsPath:
    type: string
    description: Path to the tech-search-tools.yaml file
    default: tech-search-tools.yaml
  outputDirectory:
    type: string
    description: Directory where normalized documentation chunks will be stored
    default: .ai/doc-ingestion
outputs:
  ingestionReport:
    type: string
    description: Report describing which documents were captured, stored under the output directory
    default: documentation-ingestion-report.md
steps:
  - id: parse-search-tools
    name: Parse Search Tools Configuration
    description: Read and parse the tech search tools file
    actions:
      - description: Load the search tools configuration
        action: Read the {{inputs.searchToolsPath}} file and extract documentation queries
        elicit: true
  
  - id: fetch-documentation
    name: Fetch Documentation Content
    description: Fetch documentation from identified sources
    actions:
      - description: For each documentation query, fetch the content (execute fetches concurrently up to a safe limit, e.g., maxParallel=4)
        action: |
          echo "Fetching documentation based on queries..."
          echo "This step would typically:"
          echo "1. Use web scraping or APIs to fetch documentation"
          echo "2. Clean and parse the HTML/markdown content"
          echo "3. Extract code examples and explanations"
          echo "4. Store temporarily for processing"
        elicit: true
  
  - id: process-content
    name: Normalize Documentation Content
    description: Convert documentation into compact, chunked text bundles for local indexing
    actions:
      - description: Process documentation content for local storage (chunk and process documents with bounded concurrency)
        action: |
          echo "Processing documentation for local knowledge pack..."
          echo "This would:"
          echo "1. Split documentation into semantic chunks"
          echo "2. Capture source metadata (url, title, technology, lastUpdated)"
          echo "3. Produce normalized markdown/plaintext snippets"
          echo "4. Stage JSONL/Markdown files for local storage"
        elicit: true

  - id: persist-locally
    name: Persist Documentation Locally
    description: Store processed documentation chunks in the configured directory
    actions:
      - description: Move normalized chunks into the output directory and merge with any existing knowledge pack
        action: |
          mkdir -p "{{inputs.outputDirectory}}"
          echo "Writing normalized documentation to {{inputs.outputDirectory}}/docs.jsonl (or split Markdown files)"
          echo "Combine new chunks with existing entries, deduplicating by source + heading"
        elicit: true
  
  - id: generate-report
    name: Generate Ingestion Report
    description: Create a report of what was ingested
    actions:
      - description: Generate ingestion summary report
        action: |
          echo "Generating ingestion report..."
          echo "Report would include:"
          echo "- Number of documents captured"
          echo "- Technologies covered"
          echo "- Sources used"
          echo "- Destination directory and file list"
          echo "Writing report to {{inputs.outputDirectory}}/{{outputs.ingestionReport}}"
        elicit: true
        
metadata:
  agent: sm
  priority: high
  estimated_hours: 2.0
  depends_on:
    - tech-search-tools.yaml
  tags:
    - documentation
    - ingestion
  performance:
    concurrency: Prefer bounded concurrency for fetch and processing steps to reduce total ingestion time without exhausting system/network resources
