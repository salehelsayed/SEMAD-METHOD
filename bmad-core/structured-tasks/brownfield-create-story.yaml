id: brownfield-create-story
name: Create Brownfield Story Task
purpose: Create a single user story for very small brownfield enhancements that can be completed in one focused development session. This task is for minimal additions or bug fixes that require existing system integration awareness.
steps:
  - id: load-memory
    name: Load Memory and Initialize Context
    description: Load agent working memory and relevant long-term context using unified memory system
    actions:
      - description: Load agent working memory and relevant long-term context (use loadMemoryForTaskAndExit from agent-memory-loader.js if running in a subprocess)
        elicit: false
        function: loadMemoryForTask
        parameters:
          agentName: sm
          context:
            taskId: brownfield-create-story
            taskType: story-management
        metadata:
          memoryAction: true
          executionOrder: first
      - description: Apply memory context to task execution planning
        elicit: true
        metadata:
          memoryAction: true
          executionOrder: after-load
  - id: step0
    name: Initialize Memory and Context
    description: Set up working memory and retrieve relevant context
    actions:
      - description: Initialize working memory for brownfield story creation
        elicit: false
        metadata:
          originalIndent: 0
      - description: Retrieve any previous brownfield story patterns and integration approaches
        elicit: false
        metadata:
          originalIndent: 0
  - id: step1
    name: Quick Project Assessment
    description: |-
      Gather minimal but essential context about the existing project:
      **Current System Context:**
      **Change Scope:**
    actions:
      - description: '[ ] Relevant existing functionality identified'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Technology stack for this area noted'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Integration point(s) clearly understood'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Existing patterns for similar work identified'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Specific change clearly defined'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Impact boundaries identified'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Success criteria established'
        elicit: false
        metadata:
          originalIndent: 0
    metadata:
      level: 3
      originalNumber: '1'
  - id: step2
    name: Story Creation
    description: |-
      Create a single focused story following this structure:
      #### Story Title
      {{Specific Enhancement}} - Brownfield Addition
      #### User Story
      As a {{user type}},
      I want {{specific action/capability}},
      So that {{clear benefit/value}}.
      #### Story Context
      **Existing System Integration:**
      #### Acceptance Criteria
      **Functional Requirements:**
      1. {{Primary functional requirement}}
      2. {{Secondary functional requirement (if any)}}
      3. {{Integration requirement}}
      **Integration Requirements:** 4. Existing {{relevant functionality}} continues to work unchanged 5. New functionality follows existing {{pattern}} pattern 6. Integration with {{system/component}} maintains current behavior
      **Quality Requirements:** 7. Change is covered by appropriate tests 8. Documentation is updated if needed 9. No regression in existing functionality verified
      #### Technical Notes
      #### Definition of Done
    actions:
      - description: 'Integrates with: {{existing component/system}}'
        elicit: false
        metadata:
          originalIndent: 0
      - description: 'Technology: {{relevant tech stack}}'
        elicit: false
        metadata:
          originalIndent: 0
      - description: 'Follows pattern: {{existing pattern to follow}}'
        elicit: false
        metadata:
          originalIndent: 0
      - description: 'Touch points: {{specific integration points}}'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '**Integration Approach:** {{how it connects to existing system}}'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '**Existing Pattern Reference:** {{link or description of pattern to follow}}'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '**Key Constraints:** {{any important limitations or requirements}}'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Functional requirements met'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Integration requirements verified'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Existing functionality regression tested'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Code follows existing patterns and standards'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Tests pass (existing and new)'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Documentation updated if applicable'
        elicit: false
        metadata:
          originalIndent: 0
      - description: Populate the story’s **Implementation Checklist** with short category headers (Migration, DAO Updates, Tests, Telemetry, etc.) so each group stays readable while every bullet remains atomic.
        elicit: true
        metadata:
          originalIndent: 0
      - description: 'Ensure every checklist item follows the pattern: Verb + concrete target + explicit success signal (for example, "Generate migration v15 dropping only from_peer_id FK and verify rollback restores it").'
        elicit: true
        metadata:
          originalIndent: 0
      - description: Translate any narrative hints about the fix into explicit checklist items rather than prose so the developer knows the exact action to take.
        elicit: true
        metadata:
          originalIndent: 0
      - description: If an extended plan or reference doc exists, add a Companion References bullet like "See docs/stories/<companion>.md:<section>" while keeping the concise checklist in the story body.
        elicit: true
        metadata:
          originalIndent: 0
      - description: Use markdown checkboxes `[ ]` consistently across the Implementation Checklist and Definition of Done for programmatic progress tracking.
        elicit: true
        metadata:
          originalIndent: 0
    notes: '- **Key Constraints:** {{any important limitations or requirements}}'
    metadata:
      level: 3
      originalNumber: '2'
  - id: step2b
    name: StoryContract and Template Compliance
    description: |-
      Embed a StoryContract and ensure the story follows the canonical Story Template used by SM create-next-story.
      - Use docs/templates/story-contract-template.yaml as schema guidance for the StoryContract block at the top of the file.
      - Follow bmad-core/templates/story-tmpl.yaml sectioning (Dev Agent Record, QA Findings, traceability blocks, etc.).
    actions:
      - description: Ask for or detect the created story file path
        elicit: true
      - description: Embed a StoryContract YAML block at the top of the story file between --- markers
        elicit: false
      - description: Ensure sections match canonical story template (Status, Dev Agent Record, QA Findings, Traceability)
        elicit: false
      - description: Validate StoryContract structure using scripts/validate-story-contract.js
        elicit: false
        function: execute
        parameters:
          command: node scripts/validate-story-contract.js -- {{storyFilePath}}
      - description: Execute DoR mini-gate to enforce readiness
        elicit: false
        action: script:execute
        inputs:
          script: tools/sm/dor-gate.js
          args: []
        outputs:
          exitCode: dorExitCode
          stdout: dorStdout
      - description: Halt if DoR gate fails (<90). If first failure (70–89), perform one revision then re-run manually; if still <90, spike is created.
        elicit: false
        action: workflow:conditional-halt
        inputs:
          condition:
            '[object Object]': null
          errorMessage: 'DoR gate not passed. See report: {{dorStdout}}'
    metadata:
      level: 3
      originalNumber: 2b
  - id: step3
    name: Risk and Compatibility Check
    description: |-
      **Minimal Risk Assessment:**
      **Compatibility Verification:**
    actions:
      - description: '**Primary Risk:** {{main risk to existing system}}'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '**Mitigation:** {{simple mitigation approach}}'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '**Rollback:** {{how to undo if needed}}'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] No breaking changes to existing APIs'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Database changes (if any) are additive only'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] UI changes follow existing design patterns'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Performance impact is negligible'
        elicit: false
        metadata:
          originalIndent: 0
    metadata:
      level: 3
      originalNumber: '3'
  - id: step4
    name: Validation Checklist
    description: |-
      Before finalizing the story, confirm:
      **Scope Validation:**
      **Clarity Check:**
      The story creation is successful when:
      1. Enhancement is clearly defined and appropriately scoped for single session
      2. Integration approach is straightforward and low-risk
      3. Existing system patterns are identified and will be followed
      4. Rollback plan is simple and feasible
      5. Acceptance criteria include existing functionality verification
    actions:
      - description: '[ ] Story can be completed in one development session'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Integration approach is straightforward'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Follows existing patterns exactly'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] No design or architecture work required'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Story requirements are unambiguous'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Integration points are clearly specified'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Success criteria are testable'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Rollback approach is simple'
        elicit: false
        metadata:
          originalIndent: 0
      - description: This task is for VERY SMALL brownfield changes only
        elicit: true
        metadata:
          originalIndent: 0
      - description: If complexity grows during analysis, escalate to brownfield-create-epic
        elicit: false
        metadata:
          originalIndent: 0
      - description: Always prioritize existing system integrity
        elicit: false
        metadata:
          originalIndent: 0
      - description: When in doubt about integration complexity, use brownfield-create-epic instead
        elicit: false
        metadata:
          originalIndent: 0
      - description: Stories should take no more than 4 hours of focused development work
        elicit: false
        metadata:
          originalIndent: 0
    metadata:
      level: 3
      originalNumber: '4'
  - id: save-memory
    name: Save Task Results and Clean Memory
    description: Save task completion and findings to memory with hygiene cleanup
    actions:
      - description: Save task completion and findings to working memory (use saveAndCleanMemoryAndExit from agent-memory-loader.js if running in a subprocess)
        elicit: true
        function: saveAndCleanMemory
        parameters:
          agentName: sm
          taskData:
            observation: Completed brownfield-create-story task successfully
            significantFinding: '{{TASK_SIGNIFICANT_FINDING}}'
            taskCompleted: true
            taskId: brownfield-create-story
            context:
              taskType: story-management
        metadata:
          memoryAction: true
          executionOrder: last
outputs:
  - name: story
    type: file
    description: Generated story using story-tmpl.yaml template in YAML format
metadata:
  originalSections:
    - Purpose
    - When to Use This Task
    - Instructions
    - Success Criteria
    - Important Notes
  preservedContent:
    - type: section-header
      content: Important Notes
      level: 2
    - type: section-header
      content: Important Notes
      level: 2
