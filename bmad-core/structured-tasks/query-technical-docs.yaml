id: query-technical-docs
name: Query Technical Documentation
purpose: Search locally stored documentation bundles for information relevant to the current task
inputs:
  query:
    type: string
    description: The technical query or question
    required: true
  technology:
    type: string
    description: Specific technology to focus on (optional)
    default: ""
  limit:
    type: number
    description: Maximum number of results to return
    default: 5
  searchPaths:
    type: string
    description: Comma-separated list of directories to search (relative to project root)
    default: "docs,data/kb,.ai/doc-ingestion"
outputs:
  documentation:
    type: array
    description: Relevant documentation snippets with sources
steps:
  - id: enhance-query
    name: Enhance Query with Context
    description: Enhance the query with current project context
    actions:
      - description: Add project-specific context to the query
        action: |
          # This would enhance the query based on:
          # - Current story/task context
          # - Known technology stack
          # - Previous similar queries
          enhanced_query="{{inputs.query}} {{inputs.technology}}"
        elicit: false
  
  - id: search-local-docs
    name: Search Local Documentation Sets
    description: Query the configured directories for matching documentation snippets
    actions:
      - description: Search documentation directories based on query
        action: |
          IFS=',' read -ra SEARCH_PATHS <<< "{{inputs.searchPaths}}"
          mkdir -p .ai/doc-search
          RESULT_FILE=".ai/doc-search/latest-results.txt"
          : > "$RESULT_FILE"

          for dir in "${SEARCH_PATHS[@]}"; do
            if [ -d "$dir" ]; then
              echo "# Results from $dir" >> "$RESULT_FILE"
              rg --with-filename --no-heading --line-number --max-filesize 512K --max-count {{inputs.limit}} "{{inputs.query}}" "$dir" >> "$RESULT_FILE" || true
              echo "" >> "$RESULT_FILE"
            fi
          done

          head -n $(( {{inputs.limit}} * 10 )) "$RESULT_FILE"
          echo "\n---FILE_OUTPUT---"
          echo "$RESULT_FILE"
        elicit: true
  
  - id: format-results
    name: Format Documentation Results
    description: Format the retrieved documentation for agent use
    actions:
      - description: Format documentation with proper context and sources
        action: |
          echo "Formatting documentation results..."
          echo "Each result should include:"
          echo "- Content snippet"
          echo "- Source URL"
          echo "- Technology/Framework"
          echo "- Last updated date"
          echo "- Relevance score"
        elicit: true
  
  - id: cache-results
    name: Cache Results
    description: Cache frequently accessed documentation
    actions:
      - description: Store results in agent's working memory for quick access
        action: |
          # Cache the results in working memory
          # This helps avoid repeated shell searches for the same information
          echo "Caching documentation results in working memory..."
        elicit: false

metadata:
  agent: all  # Any agent can use this
  priority: high
  estimated_hours: 0.1
  tags:
    - documentation
    - query
    - knowledge-base
