id: brownfield-create-epic
name: Create Brownfield Epic Task
purpose: Create a single epic for smaller brownfield enhancements that don't require the full PRD and Architecture documentation process. This task is for isolated features or modifications that can be completed within a focused scope. Supports unlimited story splitting with automatic coverage validation to ensure all acceptance criteria are addressed.
parameters:
  - name: from
    description: Path to brownfield brief or codebase to analyze
    required: true
    type: string
  - name: auto-split
    description: Enable automatic story splitting until all acceptance criteria are covered
    required: false
    type: boolean
    default: true
  - name: max-stories
    description: Maximum number of stories to create (-1 for unlimited)
    required: false
    type: number
    default: -1
  - name: complexity-budget
    description: Target complexity points per story (3-5 recommended)
    required: false
    type: number
    default: 5
  - name: link-feature
    description: Feature ID to link this epic to (e.g., FEAT-auth-session)
    required: false
    type: string
steps:
  - id: load-memory
    name: Load Memory and Initialize Context
    description: Load agent working memory and relevant long-term context using unified memory system
    actions:
      - description: Load agent working memory and relevant long-term context (use loadMemoryForTaskAndExit from agent-memory-loader.js if running in a subprocess)
        elicit: false
        function: loadMemoryForTask
        parameters:
          agentName: pm
          context:
            taskId: brownfield-create-epic
            taskType: content-creation
        metadata:
          memoryAction: true
          executionOrder: first
      - description: Apply memory context to task execution planning
        elicit: true
        metadata:
          memoryAction: true
          executionOrder: after-load
  - id: step0
    name: Initialize Memory Context
    description: Set up working memory and retrieve project context
    actions:
      - description: Initialize working memory for epic creation
        elicit: false
        metadata:
          originalIndent: 0
      - description: Retrieve relevant project context from memory
        elicit: false
        metadata:
          originalIndent: 0
  - id: step1
    name: Project Analysis (Required)
    description: |-
      Before creating the epic, gather essential information about the existing project:
      **Existing Project Context:**
      **Enhancement Scope:**
    actions:
      - description: '[ ] Project purpose and current functionality understood'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Existing technology stack identified'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Current architecture patterns noted'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Integration points with existing system identified'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Enhancement clearly defined and scoped'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Impact on existing functionality assessed'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Required integration points identified'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Success criteria established'
        elicit: false
        metadata:
          originalIndent: 0
    metadata:
      level: 3
      originalNumber: '1'
  - id: step1a
    name: Integration Survey and Contracts
    description: |
      Identify and document all integration surfaces before drafting the epic details.
      For each integration point, capture owner team, contract location, and a concrete SourceRef in the current codebase.
      Classify the delta for each integration as existing, extend, or new.
    actions:
      - description: Enumerate integrationPoints (INT-*) with ownerTeam and contract links
        elicit: true
      - description: For each INT, add SourceRef to current code (file#symbol, route path, or module export)
        elicit: true
      - description: Classify delta for each INT as existing | extend | new (SourceRef mandatory when delta ≠ new)
        elicit: true
      - description: Create minimal contract snapshot per INT (request/response, error codes, idempotency, version)
        elicit: true
      - description: Prepare Epic Coverage Matrix (ECM) rows for all REQ-* and INT-* (use docs/templates/ecm-template.md)
        elicit: true
    metadata:
      level: 3
      originalNumber: '1a'
  - id: step2
    name: Epic Creation
    description: |-
      Create a focused epic following this structure:
      #### Epic Title
      {{Enhancement Name}} - Brownfield Enhancement
      #### Epic Goal
      {{1-2 sentences describing what the epic will accomplish and why it adds value}}
      #### Epic Description
      **Existing System Context:**
      **Enhancement Details:**
      #### Stories
      List all stories needed to fully cover the epic (no artificial cap). Prefer splitting by domain sub-capabilities and interface boundaries. Target 3–5 point stories; auto-split until all acceptance criteria are covered.
      
      {{if args.auto_split}}
      AUTO-SPLIT CONFIGURATION:
      - Max stories: {{args.max_stories || 'unlimited'}} 
      - Complexity budget per story: {{args.complexity_budget || '3-5'}} points
      - Linked feature: {{args.link_feature || 'auto-generated'}}
      {{/if}}
      1. **Story 1:** {{Story title and brief description}}
      2. **Story 2:** {{Story title and brief description}}
      3. **Story 3:** {{Story title and brief description}}
      4. **Story N:** {{Add as many as needed}}
      #### Compatibility Requirements
      #### Risk Mitigation
      #### Definition of Done
    actions:
      - description: 'Current relevant functionality: {{brief description}}'
        elicit: false
        metadata:
          originalIndent: 0
      - description: 'Technology stack: {{relevant existing technologies}}'
        elicit: false
        metadata:
          originalIndent: 0
      - description: 'Integration points: {{where new work connects to existing system}}'
        elicit: false
        metadata:
          originalIndent: 0
      - description: 'What''s being added/changed: {{clear description}}'
        elicit: false
        metadata:
          originalIndent: 0
      - description: 'How it integrates: {{integration approach}}'
        elicit: false
        metadata:
          originalIndent: 0
      - description: 'Success criteria: {{measurable outcomes}}'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Existing APIs remain unchanged'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Database schema changes are backward compatible'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] UI changes follow existing patterns'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Performance impact is minimal'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '**Primary Risk:** {{main risk to existing system}}'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '**Mitigation:** {{how risk will be addressed}}'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '**Rollback Plan:** {{how to undo changes if needed}}'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] All stories completed with acceptance criteria met'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Existing functionality verified through testing'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Integration points working correctly'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Documentation updated appropriately'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] No regression in existing features'
        elicit: false
        metadata:
          originalIndent: 0
    metadata:
      level: 3
      originalNumber: '2'
  - id: step2a
    name: Incremental Slicing Rules
    description: |
      Define an incremental, reversible slicing plan to minimize integration risk.
      Seed with a feature flag slice, then prove wiring via read-only/contract tests,
      then enable one integration and one flow at a time.
    actions:
      - description: 'Story 0: Feature flag scaffolding + kill switch + telemetry (no behavior change)'
        elicit: false
      - description: 'Story 1: Contract tests/probe path for INTs (read-only; no state change)'
        elicit: false
      - description: 'Story 2+: One story per INT per flow variant (success, negative, resiliency)'
        elicit: false
      - description: Every story includes Integration Verification steps for existing functionality
        elicit: false
      - description: Every story includes a rollback plan and performance budget check
        elicit: false
    metadata:
      level: 3
      originalNumber: '2a'
  - id: step3
    name: Validation Checklist
    description: |-
      Before finalizing the epic, ensure:
      **Scope Validation:**
      **Risk Assessment:**
      **Completeness Check:**
    actions:
      - description: '[ ] Epic is decomposed into right-sized stories (3–5 points each); no hard cap on count'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] No architectural documentation is required'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Enhancement follows existing patterns'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Integration complexity is manageable'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Risk to existing system is low'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Rollback plan is feasible'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Testing approach covers existing functionality'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Team has sufficient knowledge of integration points'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Epic goal is clear and achievable'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Stories are properly scoped'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Success criteria are measurable'
        elicit: false
        metadata:
          originalIndent: 0
      - description: '[ ] Dependencies are identified'
        elicit: false
        metadata:
          originalIndent: 0
    metadata:
      level: 3
      originalNumber: '3'
  - id: step3a
    name: Epic Contract Validation
    description: Validate ECM coverage and EpicContract structure before handoff
    actions:
      - description: Ask for or detect the generated EpicContract file path
        elicit: true
      - description: Run ECM validator and fix any coverage gaps (all REQ-* and INT-* referenced in ≥1 ECM row)
        elicit: false
        function: execute
        parameters:
          command: node tools/ecm-validate.js {{epicPath}}
      - description: Validate EpicContract front matter against required fields
        elicit: false
        function: execute
        parameters:
          command: npm run validate:epic -- {{epicPath}}
    metadata:
      level: 3
      originalNumber: '3a'
  - id: step4
    name: Coverage Validation
    description: Validate that all acceptance criteria are covered by stories
    actions:
      - description: Run feature coverage validation to ensure all acceptance criteria are covered
        elicit: false
        function: execute
        parameters:
          command: node tools/feature-coverage.js --epics docs/epics --stories docs/stories --threshold {{args.coverage_threshold || 100}} --report .ai/reports/feature-coverage-epic.json
        metadata:
          originalIndent: 0
      - description: If coverage gaps exist and auto-split is enabled, create additional stories
        elicit: true
        metadata:
          originalIndent: 0
      - description: Continue splitting stories until coverage threshold is met or max-stories reached
        elicit: true
        metadata:
          originalIndent: 0
  - id: step5
    name: Handoff to Story Manager
    description: |-
      Once the epic is validated and coverage confirmed, provide this handoff to the Story Manager:
      ---
      **Story Manager Handoff:**
      "Please develop detailed user stories for this brownfield epic. Key considerations:
      The epic should maintain system integrity while delivering {{epic goal}}."
      ---

      Update working memory with epic details for future reference
      The epic creation is successful when:
      1. Enhancement scope is clearly defined and appropriately sized
      2. Integration approach respects existing system architecture
      3. Risk to existing functionality is minimized
      4. Stories are logically sequenced for safe implementation
      5. Compatibility requirements are clearly specified
      6. Rollback plan is feasible and documented
    actions:
      - description: This is an enhancement to an existing system running {{technology stack}}
        elicit: false
        metadata:
          originalIndent: 0
      - description: 'Integration points: {{list key integration points}}'
        elicit: false
        metadata:
          originalIndent: 0
      - description: 'Existing patterns to follow: {{relevant existing patterns}}'
        elicit: false
        metadata:
          originalIndent: 0
      - description: 'Critical compatibility requirements: {{key requirements}}'
        elicit: false
        metadata:
          originalIndent: 0
      - description: Each story must include verification that existing functionality remains intact
        elicit: false
        metadata:
          originalIndent: 0
      - description: This task is suitable for brownfield enhancements of any size when decomposed into right-sized stories
        elicit: true
        metadata:
          originalIndent: 0
      - description: If decomposition reveals complex cross-cutting concerns, consider complementing with the full brownfield PRD process (optional)
        elicit: false
        metadata:
          originalIndent: 0
      - description: Always prioritize existing system integrity over new functionality
        elicit: false
        metadata:
          originalIndent: 0
      - description: When in doubt about scope or complexity, escalate to full brownfield planning
        elicit: false
        metadata:
          originalIndent: 0
    notes: '- Critical compatibility requirements: {{key requirements}}'
    metadata:
      level: 3
      originalNumber: '5'
  - id: save-memory
    name: Save Task Results and Clean Memory
    description: Save task completion and findings to memory with hygiene cleanup
    actions:
      - description: Save task completion and findings to working memory (use saveAndCleanMemoryAndExit from agent-memory-loader.js if running in a subprocess)
        elicit: true
        function: saveAndCleanMemory
        parameters:
          agentName: pm
          taskData:
            observation: Completed brownfield-create-epic task successfully
            significantFinding: '{{TASK_SIGNIFICANT_FINDING}}'
            taskCompleted: true
            taskId: brownfield-create-epic
            context:
              taskType: content-creation
        metadata:
          memoryAction: true
          executionOrder: last
inputs: {}
outputs: {}
metadata:
  originalSections:
    - Purpose
    - When to Use This Task
    - Instructions
    - Success Criteria
    - Important Notes
  preservedContent:
    - type: section-header
      content: Important Notes
      level: 2
    - type: section-header
      content: Important Notes
      level: 2
